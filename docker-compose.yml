services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: deltawatch
      POSTGRES_PASSWORD: deltawatch
      POSTGRES_DB: deltawatch
    ports:
      - "5433:5432"   # 5432는 다른 랩(finance-postgres)이 이미 점유 중 - 충돌 방지
    volumes:
      - pgdata:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
    ports:
      - "5680:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  pgdata:
  n8n_data:
