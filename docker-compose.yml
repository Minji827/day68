services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: deltawatch
      POSTGRES_PASSWORD: deltawatch
      POSTGRES_DB: deltawatch
    ports:
      - "5433:5432"   # 5432는 다른 랩(finance-postgres)이 이미 점유 중 - 충돌 방지
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
